[project]
name = "yolo_lesion_47041585"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Alex Janevik", email = "ajanevik@gmail.com" }]
dependencies = [
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "torch>=2.14.1",
    "ultralytics>=8.4.182",
]

[project.scripts]
predict = "yolo_lesion_47041585.predict:main"
train = "yolo_lesion_47041585.train:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "2026-10-20T10:08:17+10:00"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "scripts", "tests"]
venvPath = "."
venv = ".venv"
