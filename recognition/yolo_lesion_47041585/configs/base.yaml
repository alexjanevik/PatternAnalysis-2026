# Shared settings for every controlled run, applied before any condition file. The augmentation
# and sampling values are A0's; b0.yaml overrides them to give the baseline B0, and every other
# condition file overrides a few keys of A0.
condition: base
seed: 47041585
data: artifacts/isic2018/yolo/dataset.yaml
split_manifest: artifacts/isic2018/split_manifest.csv
model: weights/yolo11n.pt
classes: [Benign, Malignant]

train:
  imgsz: 640
  batch: 16
  epochs: 100
  patience: 0 # no early stopping in controlled runs
  optimizer: AdamW # explicit, so "auto" cannot choose for us
  lr0: 0.001
  lrf: 0.01
  cos_lr: false # linear schedule
  momentum: 0.9 # AdamW beta1
  weight_decay: 0.0005
  warmup_epochs: 3
  freeze: null # fine-tune all layers
  amp: true
  nbs: 16 # nominal batch = batch, so no gradient accumulation
  workers: 8
  rect: false
  deterministic: true
  cache: ram # keeps the resized images in memory, so full-size JPEGs are decoded once
  plots: false # Ultralytics' own plots need a font download; the project plots from results.csv

# Ultralytics augmentation defaults must be set explicitly.
# b0.yaml turns every one of them off.
augment:
  hsv_h: 0.015
  hsv_s: 0.4
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.2
  shear: 0.0
  perspective: 0.0
  flipud: 0.5
  fliplr: 0.5
  mosaic: 0.0
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  erasing: 0.0
  auto_augment: null

# scheme "stock" is the plain Ultralytics shuffle (the B0 baseline). "replacement" draws
# each epoch with replacement through the project's sampler: uniform when malignant_fraction
# is null, so A0, O35 and O50 differ only in malignant_fraction.
sampling:
  scheme: replacement
  malignant_fraction: null

inference:
  conf: 0.001
  iou: 0.7 # class-aware NMS
  max_det: 100
